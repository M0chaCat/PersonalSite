    <style>
        #homecontainer {
            display: grid;
            gap: var(--cardpadding);

            grid-template-rows:
                auto auto auto auto auto;

            grid-template-columns: 1fr 1fr 1fr;

            grid-template-areas:
                "bio       bio       bio"
                "buttons   buttons   creations"
                "rings     rings     creations"
                /*"song      chat      chat"*/
                "guestbook guestbook guestbook";

            margin-bottom: -25px;
        }

        #bio {
            grid-area: bio;
        }

        #friends {
            grid-area: buttons;
        }

        #creations {
            grid-area: creations;
        }

        #webrings {
            grid-area: rings;
        }

        #chat {
            grid-area: chat;
            height: 500px;
        }

        #now-playing {
            grid-area: song;
        }

        #guestbook {
            grid-area: guestbook;
        }

        body[data-theme="hypr"] #kittytisement {
            transform: translateY(80px) translateX(5px) rotate(-1deg);
        }

        body[data-theme="hypr"] #friends {
            transform: translateY(20px) rotate(2deg);
        }

        body[data-theme="hypr"] #creations {
            transform: translateY(10px) translateX(20px) rotate(2deg);
        }

        body[data-theme="hypr"] #webrings {
            transform: translateY(50px) translateX(5px) rotate(-3deg);
        }

        body[data-theme="hypr"] #guestbook {
            transform: translateY(50px) translateX(20px) rotate(-3deg);
        }

        body[data-theme="hypr"] #glitter {
            transform: translateY(110px) translateX(20px) rotate(5deg);
        }
    </style>
</div>
