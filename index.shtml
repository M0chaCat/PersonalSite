    <style>
        #homecontainer {
            display: grid;
            gap: var(--cardpadding);

            grid-template-rows:
                auto auto auto auto auto auto auto auto auto auto auto auto auto auto;

            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;

            grid-template-areas:
                "bio       bio       bio       bio       bio       bio"
                "bio       bio       bio       bio       bio       bio"
                "buttons   buttons   buttons   buttons   creations creations"
                "buttons   buttons   buttons   buttons   creations creations"
                "favalbums favalbums favalbums favalbums creations creations"
                "favalbums favalbums favalbums favalbums creations creations"
                "favalbums favalbums favalbums favalbums creations creations"
                "rings      rings    rings      mood      mood      mood"
                "rings      rings    rings      mood      mood      mood"
                "guestbook guestbook guestbook guestbook guestbook guestbook";
                "guestbook guestbook guestbook guestbook guestbook guestbook";

            margin-bottom: -25px;
        }

        #bio {
            grid-area: bio;
        }

        #mood {
            grid-area: mood;
        }

        #friends {
            grid-area: buttons;
        }

        #creations {
            grid-area: creations;
        }

        #webrings {
            grid-area: rings;
        }

        #chat {
            grid-area: chat;
            height: 500px;
        }

        #favalbums {
            grid-area: favalbums;
        }

        #guestbook {
            grid-area: guestbook;
        }

        body[data-theme="hypr"] #kittytisement {
            transform: translateY(80px) translateX(5px) rotate(-1deg);
        }

        body[data-theme="hypr"] #friends {
            transform: translateY(20px) rotate(2deg);
        }

        body[data-theme="hypr"] #creations {
            transform: translateY(10px) translateX(20px) rotate(2deg);
        }

        body[data-theme="hypr"] #webrings {
            transform: translateY(54px) translateX(5px) rotate(-1deg);
        }

        body[data-theme="hypr"] #mood {
            transform: translateY(30px) translateX(17px) rotate(-2.7deg);
        }

        body[data-theme="hypr"] #guestbook {
            transform: translateY(50px) translateX(20px) rotate(-3deg);
        }

        body[data-theme="hypr"] #glitter {
            transform: translateY(110px) translateX(20px) rotate(5deg);
        }

        body[data-theme="hypr"] #favalbums {
            transform: translateY(45px) translateX(10px) rotate(-2deg);
        }
    </style>
</div>
