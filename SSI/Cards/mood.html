const BG = {
    BIND: i => Object.assign(window, BG),

    StyleSwitches: [],
    TEST: false,
    CLOG: i => BG.TEST === true ? console.log(i) : 'false',

    GEBI: (a, b = document) => b.getElementById(a),

    GEBC: (a, b = 0) =>
        typeof b === 'string'
            ? document.getElementsByClassName(a)
            : document.getElementsByClassName(a)[b],

    GEBQ: (a, b = document) =>
        b.querySelector(a) ? b.querySelector(a) : false,

    GEBA: (a, b = document) => b.querySelectorAll(a),

    RCBQ: i =>
        BG.GEBQ(`.${i}`) === false
            ? undefined
            : BG.GEBQ(`.${i}`).classList.remove(i),

    CADD: (a, b) => {
        CLOG(a, b);
        typeof a === 'string'
            ? BG.GEBI(a).classList.add(b)
            : a.classList.add(b);
    },

    CDEL: (a, b) => {
        CLOG(a, b);
        typeof a === 'string'
            ? BG.GEBI(a).classList.remove(b)
            : a.classList.remove(b);
    },

    CTOG: (a, b) => {
        CLOG(a, b);
        return (
            typeof a === 'string'
                ? BG.GEBI(a).classList.toggle(b)
                : a.classList.toggle(b)
        );
    },

    HIDE: i =>
        typeof i === 'string'
            ? BG.GEBI(i).classList.add('HIDE')
            : i.classList.add('HIDE'),

    SHOW: i =>
        typeof i === 'string'
            ? BG.GEBI(i).classList.remove('HIDE')
            : i.classList.remove('HIDE'),

    HTOG: i => BG.CTOG(i, "HIDE"),

    HCON: (a, b) =>
        b ? BG.HIDE(a) : BG.SHOW(a),

    NRND: n => Math.round(100 * n) / 100,

    DRND: (i, a = 2) =>
        ("0" + i).slice(-(a)),

    AVGN: c =>
        BG.NRND(c.reduce((a, b) => a + b) / c.length),

    RNG1: max =>
        Math.floor(Math.random() * max),

    CAPR: (i, max = 5) =>
        (0 > i) ? max : i,

    CAPN: (i, max = 5) =>
        (i > max) ? 0 : BG.CAPR(i, max),

    NTSB: i =>
        i.match(/\d+/)
            ? parseInt(i.match(/\d+/)[0], 10)
            : null,

    ARED: i =>
        (i.reduce((a, c) => a + c, 0)) / i.length,

    ELGA: (a, b) =>
        a.getAttribute(b),

    JUMP: i =>
        i.scroll(0, 0),

    IARR: function(arr, el, pos) {
        let temp = arr[el];
        arr[el] = arr[pos];
        arr[pos] = temp;
        return arr;

    DCE: function(y = 'div', x = 'empty', l = 'null') {
        BG.CLOG(y, x, l);

        if (!(typeof y === 'string')) {
            x = Object.assign({}, y);
            y = 'div';
        }

        let m = document.createElement(y);

        if (x !== 'empty') {
            for (const z in x) {
                m[z] = x[z];
            }
        }

        if (l !== 'null') {
            l === 'string'
                ? BG.GEBI(l).appendChild(m)
                : l.appendChild(m);
        }

        BG.CLOG('DCE!', m);
        return m;
    },

    STSW: function(y = 'unlabelled', x = ['0', '1']) {
        this.props = x;
        this.state = true;

        this.obj = BG.DCE(
            'style',
            { 'className': 'BGSTSW' },

        );

        this.id =
            y === 'unlabelled'

        this.sw = (i = 'neg') => {

            ];

            return res[y];

const decoder2 = function(x) {
    const rawdata = (typeof x === 'string') ? x : String(x);
    const vers = (x.date) ? '00' : rawdata.slice(6, 8);

    const dataObj = {};

    if (vers === '00') {
        dataObj.HP = Number(x.HP) * 100;
        dataObj.EN = Number(x.EN) * 100;
        dataObj.time =
            (Number(x.time.slice(0, 2)) * 60) +
            Number(x.time.slice(3, 5));
        dataObj.year = 2025;
        dataObj.date =
            `${x.date.slice(5, 7)}${x.date.slice(8, 10)}`;
    }

    if (vers === '01' || vers === '02') {
        dataObj.HP = Number(rawdata.slice(0, 3));
        dataObj.EN = Number(rawdata.slice(3, 6));
    }

    if (vers === '01') {
        dataObj.time =
            (Number(rawdata.slice(8, 10)) * 60) +
            Number(rawdata.slice(10, 12));

        dataObj.date = rawdata.slice(12, 16);
        dataObj.EM = rawdata.slice(16, 17);
        dataObj.year = 2025;
    }

    if (vers === '02') {
        dataObj.time =
            (Number(rawdata.slice(14, 16)) * 60) +
            Number(rawdata.slice(16, 18));

        dataObj.date = rawdata.slice(10, 14);
        dataObj.EM = Number(rawdata.slice(-2));
        dataObj.year =
            2020 + Number(rawdata.slice(9, 10));
    }

    return dataObj;
};

function getEmotion(pleasantness, energy) {

    pleasantness = Number(pleasantness);
    energy = Number(energy);

    if (
        !Number.isFinite(pleasantness) ||
        !Number.isFinite(energy)
    ) {
        return undefined;
    }

    const col = Math.min(
        5,
        Math.max(
            0,
            Math.floor(
                (pleasantness + 1) / 2 * 6
            )
        )
    );

    const row = Math.min(
        5,
        Math.max(
            0,
            Math.floor(
                (1 - energy) / 2 * 6
            )
        )
    );

    return moodGrid[row][col];
}

            const energy =

            return {

                id: Number(obj.id),

                energy,

                timestamp:

                Happiness:
                    pleasantness * 5 + 5,

                        energy
                    ),

                Date:
                    new Date(
                        Number(obj.timestamp)
                    )

        });


        x.sort(
            (a, b) => b.Date - a.Date

                );

                continue;
            }


            let year =
                String(
                    x[i].Date.getFullYear()
                );


            if (!eData.annual[year]) {
                eData.annual[year] = {};
            }


            let month = [
                'January',
                'February',
                'March',
                'April',
                'May',
                'June',
                'July',
                'August',
                'September',
                'October',
                'November',
                'December'
            ][
                x[i].Date.getMonth()
            ];


            if (!eData.annual[year][month]) {
                eData.annual[year][month] = {};
            }


            let curDay =
                x[i].Date.getDate();

                x[i].Date.getHours() < 7
